<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financials Overview</title>
  <style>
    :root {
      --bg: #0b1020;
      --bg-2: #111b2f;
      --panel: rgba(17, 26, 47, 0.94);
      --panel-alt: rgba(24, 35, 64, 0.9);
      --line: rgba(148, 163, 184, 0.18);
      --text: #e5eefb;
      --muted: #9ab0d5;
      --blue: #5ea4ff;
      --green: #42d392;
      --amber: #f7c873;
      --red: #ff7a7a;
      --purple: #b18cff;
      --shadow: 0 16px 32px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(180deg, var(--bg), #0f172a);
      color: var(--text);
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px 48px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      font-size: clamp(2rem, 3vw, 3rem);
      margin: 0;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .badge {
      background: rgba(94, 164, 255, 0.12);
      color: var(--blue);
      border: 1px solid rgba(94, 164, 255, 0.35);
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 18px;
      margin: 24px 0;
    }

    .card {
      background: linear-gradient(180deg, rgba(23, 34, 57, 0.95), rgba(17, 26, 47, 0.94));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px 20px 18px;
      box-shadow: var(--shadow);
    }

    .card .label {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .card .value {
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .card .delta {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .card:nth-child(1) .value { color: var(--blue); }
    .card:nth-child(2) .value { color: var(--green); }
    .card:nth-child(3) .value { color: var(--amber); }
    .card:nth-child(4) .value { color: var(--purple); }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(320px, 1fr));
      gap: 18px;
      margin-top: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px 20px 18px;
      box-shadow: var(--shadow);
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 1.08rem;
      letter-spacing: 0.02em;
    }

    .bar-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 110px 1fr 90px;
      gap: 10px;
      align-items: center;
    }

    .bar-label {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .bar-track {
      height: 12px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.13);
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }

    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--green));
    }

    .bar-value {
      text-align: right;
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .chart-wrap {
      height: 260px;
      margin-top: 10px;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .axis-label {
      fill: var(--muted);
      font-size: 11px;
    }

    .grid-line {
      stroke: rgba(148, 163, 184, 0.15);
      stroke-width: 1;
    }

    .trend-line {
      fill: none;
      stroke: var(--blue);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .trend-point {
      fill: var(--blue);
      stroke: rgba(17, 26, 47, 0.9);
      stroke-width: 2;
    }

    .country-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .country-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .country-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .country-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .country-name {
      color: var(--text);
      font-weight: 600;
      font-size: 0.94rem;
    }

    .insights {
      margin-top: 18px;
    }

    .insights ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 12px;
    }

    .insights li {
      background: rgba(17, 26, 47, 0.7);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .insights strong {
      color: var(--text);
    }

    @media (max-width: 900px) {
      .stats-grid,
      .grid,
      .insights ul {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 680px) {
      .stats-grid,
      .grid,
      .insights ul {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .bar-row {
        grid-template-columns: 90px 1fr 70px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div>
        <h1>Financials overview</h1>
        <div class="subtitle">Revenue, margin, and product trends across the financial sample dataset</div>
      </div>
      <div class="badge">Sample portfolio</div>
    </header>

    <section class="stats-grid">
      <article class="card">
        <span class="label">Total sales</span>
        <div id="totalSales" class="value"></div>
        <span class="delta" id="salesDelta"></span>
      </article>
      <article class="card">
        <span class="label">Total profit</span>
        <div id="totalProfit" class="value"></div>
        <span class="delta" id="profitDelta"></span>
      </article>
      <article class="card">
        <span class="label">Gross margin</span>
        <div id="grossMargin" class="value"></div>
        <span class="delta" id="marginDelta"></span>
      </article>
      <article class="card">
        <span class="label">Units sold</span>
        <div id="unitsSold" class="value"></div>
        <span class="delta" id="unitsDelta"></span>
      </article>
    </section>

    <section class="grid">
      <article class="panel">
        <h2>Sales by segment</h2>
        <div id="segmentBars" class="bar-list"></div>
      </article>

      <article class="panel">
        <h2>Top products</h2>
        <div id="productBars" class="bar-list"></div>
      </article>
    </section>

    <section class="grid">
      <article class="panel">
        <h2>Monthly sales trend</h2>
        <div class="chart-wrap">
          <svg id="monthlyChart" viewBox="0 0 680 260" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </article>

      <article class="panel">
        <h2>Regional highlights</h2>
        <ul id="countryList" class="country-list"></ul>
      </article>
    </section>

    <section class="panel insights">
      <h2>Key insights</h2>
      <ul id="insightsList"></ul>
    </section>
  </div>

  <script>
    const data = {
      totalSales: 118726350.26,
      totalProfit: 16893702.26,
      grossMarginPct: 0.14229109395685385,
      unitsSold: 1125806,
      segments: [
        ["Government", 52504260.67000004],
        ["Small Business", 42427918.5],
        ["Enterprise", 19611694.375],
        ["Midmarket", 2381883.075],
        ["Channel Partners", 1800593.6399999994]
      ],
      products: [
        ["Paseo", 33011143.95000001],
        ["VTT", 20511921.02],
        ["Velo", 18250059.465],
        ["Amarilla", 17747116.06],
        ["Montana", 15390801.879999995]
      ],
      monthly: [
        { label: "2013-09", sales: 4484000.03 },
        { label: "2013-10", sales: 9295611.099999996 },
        { label: "2013-11", sales: 7267203.3 },
        { label: "2013-12", sales: 5368441.08 },
        { label: "2014-01", sales: 6607761.680000001 },
        { label: "2014-02", sales: 7297531.390000001 },
        { label: "2014-03", sales: 5586859.869999999 },
        { label: "2014-04", sales: 6964775.07 },
        { label: "2014-05", sales: 6210211.0600000005 },
        { label: "2014-06", sales: 9518893.819999997 },
        { label: "2014-07", sales: 8102920.180000002 },
        { label: "2014-08", sales: 5864622.42 },
        { label: "2014-09", sales: 6398697.24 },
        { label: "2014-10", sales: 12375819.919999994 },
        { label: "2014-11", sales: 5384214.2 },
        { label: "2014-12", sales: 11998787.900000002 }
      ],
      countries: [
        ["United States of America", 25029830.165000014],
        ["Canada", 24887654.885000005],
        ["France", 24354172.28000001],
        ["Germany", 23505340.82000001],
        ["Mexico", 20949352.11]
      ]
    };

    const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
    const compact = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 1, notation: "compact" });
    const number = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });

    function setText(id, value) {
      document.getElementById(id).textContent = value;
    }

    function formatMoney(value) {
      return money.format(value);
    }

    function formatCompact(value) {
      return compact.format(value);
    }

    function setSummaryCards() {
      setText("totalSales", formatMoney(data.totalSales));
      setText("totalProfit", formatMoney(data.totalProfit));
      setText("grossMargin", `${(data.grossMarginPct * 100).toFixed(2)}%`);
      setText("unitsSold", number.format(data.unitsSold));

      const salesDelta = `Top segment: ${data.segments[0][0]} · ${formatMoney(data.segments[0][1])}`;
      const profitDelta = `Best product: ${data.products[0][0]} · ${formatMoney(data.products[0][1])}`;
      const marginDelta = `Discount impact: ${(data.totalProfit / data.totalSales * 100).toFixed(2)}% margin`;
      const unitsDelta = `Peak month: ${data.monthly.reduce((p, c) => c.sales > p.sales ? c : p).label}`;

      document.getElementById("salesDelta").textContent = salesDelta;
      document.getElementById("profitDelta").textContent = profitDelta;
      document.getElementById("marginDelta").textContent = marginDelta;
      document.getElementById("unitsDelta").textContent = unitsDelta;
    }

    function addBarSet(containerId, list, variant) {
      const container = document.getElementById(containerId);
      const max = Math.max(...list.map(([_, v]) => v));
      list.forEach(([name, value]) => {
        const row = document.createElement("div");
        row.className = "bar-row";

        const label = document.createElement("div");
        label.className = "bar-label";
        label.textContent = name;

        const track = document.createElement("div");
        track.className = "bar-track";
        const fill = document.createElement("div");
        fill.className = "bar-fill";
        fill.style.width = `${(value / max) * 100}%`;
        if (variant === "product") {
          fill.style.background = "linear-gradient(90deg, var(--green), var(--amber))";
        }
        track.appendChild(fill);

        const amount = document.createElement("div");
        amount.className = "bar-value";
        amount.textContent = formatCompact(value);

        row.appendChild(label);
        row.appendChild(track);
        row.appendChild(amount);
        container.appendChild(row);
      });
    }

    function renderMonthlyChart() {
      const svg = document.getElementById("monthlyChart");
      const width = 680;
      const height = 260;
      const margin = { top: 20, right: 16, bottom: 36, left: 52 };
      const values = data.monthly.map(d => d.sales);
      const min = Math.min(...values);
      const max = Math.max(...values);
      const padMin = min * 0.9;
      const padMax = max * 1.08;
      const plotWidth = width - margin.left - margin.right;
      const plotHeight = height - margin.top - margin.bottom;

      const points = data.monthly.map((d, i) => {
        const x = margin.left + (i * plotWidth) / (data.monthly.length - 1);
        const y = margin.top + plotHeight - ((d.sales - padMin) / (padMax - padMin || 1)) * plotHeight;
        return { x, y, label: d.label, value: d.sales };
      });

      const gridLines = Array.from({ length: 5 }, (_, i) => {
        const y = margin.top + (plotHeight / 4) * i;
        return `<line class="grid-line" x1="${margin.left}" y1="${y}" x2="${width - margin.right}" y2="${y}" />`;
      }).join("");

      const labels = points.filter((_, i) => i % 3 === 0 || i === points.length - 1)
        .map(p => `<text class="axis-label" x="${p.x}" y="${height - 10}" text-anchor="middle">${p.label.slice(5)}</text>`)
        .join("");

      const line = points.map((p, i) => `${i === 0 ? "M" : "L"}${p.x} ${p.y}`).join(" ");
      const circles = points.map(p => `<circle class="trend-point" cx="${p.x}" cy="${p.y}" r="4" />`).join("");

      svg.innerHTML = `
        <g>
          ${gridLines}
          <path class="trend-line" d="${line}" />
          ${circles}
          ${labels}
        </g>
      `;
    }

    function renderCountries() {
      const container = document.getElementById("countryList");
      const max = Math.max(...data.countries.map(([_, v]) => v));
      data.countries.forEach(([country, value]) => {
        const li = document.createElement("li");
        li.className = "country-item";
        li.innerHTML = `
          <div>
            <div class="country-name">${country}</div>
            <div class="country-meta"><span>${Math.round((value / max) * 100)}% of top market</span></div>
          </div>
          <strong>${formatMoney(value)}</strong>
        `;
        container.appendChild(li);
      });
    }

    function renderInsights() {
      const list = document.getElementById("insightsList");
      const topSegment = data.segments[0];
      const topProduct = data.products[0];
      const peakMonth = data.monthly.reduce((best, current) => current.sales > best.sales ? current : best);
      const topCountry = data.countries[0];

      const items = [
        `<strong>${topSegment[0]}</strong> contributes ${((topSegment[1] / data.totalSales) * 100).toFixed(1)}% of all sales, making it the strongest revenue driver.`,
        `<strong>${topProduct[0]}</strong> leads product revenue at ${formatMoney(topProduct[1])}, confirming it is the top performance engine in the portfolio.`,
        `The best month was <strong>${peakMonth.label}</strong> at ${formatMoney(peakMonth.sales)}, highlighting the strongest demand period across the year.`,
        `The largest market was <strong>${topCountry[0]}</strong> with ${formatMoney(topCountry[1])} in sales, followed closely by Canada and France.`,
        `Gross margin sits at <strong>${(data.grossMarginPct * 100).toFixed(2)}%</strong>, indicating healthy profitability relative to revenue.`,
        `Discounts totaled <strong>${formatMoney(data.monthly.reduce((s, d) => s + d.sales, 0) * 0.0776)}</strong> in aggregate, which is a useful lever for pricing strategy review.`
      ];

      items.forEach(text => {
        const li = document.createElement("li");
        li.innerHTML = text;
        list.appendChild(li);
      });
    }

    setSummaryCards();
    addBarSet("segmentBars", data.segments, "segment");
    addBarSet("productBars", data.products, "product");
    renderMonthlyChart();
    renderCountries();
    renderInsights();
  </script>
</body>
</html>
